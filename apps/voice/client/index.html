<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sia, a multilingual voice agent powered by Sarvam speech." />
    <title>Sia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <button
        id="sidebar-open"
        class="sidebar-open"
        type="button"
        aria-label="Open conversations"
        aria-controls="sidebar"
        aria-expanded="false"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M4 5h16M4 12h16M4 19h16" />
        </svg>
      </button>

      <aside id="sidebar" class="sidebar" aria-label="Conversation sidebar">
        <header class="sidebar-header">
          <div class="sidebar-brand">
            <span class="sidebar-brand-mark" aria-hidden="true"></span>
            <span class="sidebar-label">Sia</span>
          </div>
          <button
            id="sidebar-toggle"
            class="sidebar-icon-button"
            type="button"
            aria-label="Collapse conversations"
            aria-expanded="true"
          >
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="m14 7-5 5 5 5" />
            </svg>
          </button>
        </header>

        <button id="new-session" class="new-chat-button" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M5 12h14" />
          </svg>
          <span class="sidebar-label">New conversation</span>
        </button>

        <div class="sidebar-section-heading">
          <span class="sidebar-label">Recent</span>
          <span id="history-count" class="sidebar-label">0 messages</span>
        </div>
        <nav id="session-list" class="session-list" aria-label="Recent conversations"></nav>

        <select id="session-select" class="sr-only" aria-label="Previous conversations">
          <option value="">Current conversation</option>
        </select>

        <footer class="sidebar-footer">
          <div class="connection" title="Voice server status">
            <span id="connection-dot" class="connection-dot"></span>
            <span id="connection-label" class="sidebar-label">Connecting</span>
          </div>
          <span class="sidebar-label sidebar-footer-copy">Sarvam voice</span>
        </footer>
      </aside>
      <button
        id="sidebar-backdrop"
        class="sidebar-backdrop"
        type="button"
        aria-label="Close menu"
      ></button>

      <section class="conversation-view" aria-label="Conversation" aria-live="polite">
        <div id="history" class="history">
          <p class="history-empty">Ask with your voice or type below.</p>
        </div>
      </section>

      <section class="voice-dock" aria-label="Talk to Sia">
        <div class="orb-wrap">
          <div id="orb" class="orb" data-state="idle" aria-hidden="true">
            <div class="orb-ring orb-ring-one"></div>
            <div class="orb-ring orb-ring-two"></div>
            <div class="orb-core"></div>
          </div>
          <div class="state-copy">
            <span id="state-label" class="state-label">Ready when you are</span>
            <span id="state-detail" class="state-detail">Type a message or tap the microphone</span>
          </div>
        </div>

        <form id="text-form" class="composer">
          <textarea
            id="text-input"
            name="message"
            rows="1"
            autocomplete="off"
            aria-label="Message Sia"
            placeholder="Do anything"
          ></textarea>

          <div class="composer-toolbar">
            <div class="toolbar-group">
              <button id="add-button" class="icon-button" type="button" aria-label="Attach a file">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M12 5v14M5 12h14" />
                </svg>
              </button>
              <button
                id="settings-button"
                class="mode-button"
                type="button"
                aria-expanded="false"
                aria-controls="settings-panel"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path
                    d="M12 15.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4ZM19 13.3v-2.6l-2-.7-.5-1.1.9-1.9-1.9-1.9-1.9.9-1.1-.5-.7-2H9.2l-.7 2-1.1.5-1.9-.9L3.6 7l.9 1.9-.5 1.1-2 .7v2.6l2 .7.5 1.1-.9 1.9 1.9 1.9 1.9-.9 1.1.5.7 2h2.6l.7-2 1.1-.5 1.9.9 1.9-1.9-.9-1.9.5-1.1 2-.7Z"
                  />
                </svg>
                <span>Custom</span>
              </button>
            </div>

            <div class="toolbar-group toolbar-group-right">
              <button
                id="speaker-button"
                class="icon-button"
                type="button"
                aria-label="Mute voice responses"
                aria-pressed="false"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M5 10v4h3l5 4V6l-5 4H5Zm11-1.5c1 .9 1.5 2 1.5 3.5S17 14.6 16 15.5" />
                </svg>
              </button>
              <button
                id="voice-button"
                class="icon-button"
                type="button"
                aria-label="Start conversation"
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="9" y="3.5" width="6" height="11" rx="3" />
                  <path d="M6.5 11.5a5.5 5.5 0 0 0 11 0M12 17v3M9 20h6" />
                </svg>
                <span id="voice-button-label" class="sr-only">Start conversation</span>
              </button>
              <button
                id="send-button"
                class="send-button"
                type="submit"
                aria-label="Send message"
                disabled
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m7 12 5-5 5 5M12 7v10" />
                </svg>
              </button>
              <button
                id="interrupt-button"
                class="close-button"
                type="button"
                aria-label="Stop response"
                disabled
              >
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="m7 7 10 10M17 7 7 17" />
                </svg>
              </button>
            </div>
          </div>

          <span id="upload-status" class="upload-status" role="status"></span>
        </form>
      </section>

      <aside id="settings-panel" class="settings-panel" hidden>
        <div class="panel-heading">
          <span>Voice settings</span>
        </div>
        <label>
          <span>Input language</span>
          <select id="language">
            <option value="unknown">Auto-detect</option>
            <option value="en-IN">English</option>
            <option value="hi-IN">हिन्दी</option>
            <option value="bn-IN">বাংলা</option>
            <option value="ta-IN">தமிழ்</option>
            <option value="te-IN">తెలుగు</option>
            <option value="kn-IN">ಕನ್ನಡ</option>
            <option value="ml-IN">മലയാളം</option>
            <option value="mr-IN">मराठी</option>
            <option value="gu-IN">ગુજરાતી</option>
            <option value="pa-IN">ਪੰਜਾਬੀ</option>
          </select>
        </label>
      </aside>

      <form id="upload-form" class="hidden-upload">
        <input id="file-input" name="file" type="file" />
        <button id="upload-button" type="submit">Upload</button>
      </form>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
